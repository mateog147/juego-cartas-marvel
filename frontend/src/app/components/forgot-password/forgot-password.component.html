<div class="displayTable">
  <div class="displayTableCell">
    <div class="authBlock">
      <header class="auth-brand">
        <p class="kicker">Recuperar</p>
        <h1 class="brand-wordmark">Password</h1>
        <p>Te mandamos el link de reset al mail.</p>
      </header>
      <div class="formGroup">
        <input type="email" class="formControl" placeholder="Email" #passwordResetEmail required>
      </div>
      <div class="formGroup">
        <input type="submit" class="btn btnPrimary" value="Enviar reset"
               (click)="authService.ForgotPassword(passwordResetEmail.value)">
      </div>
    </div>
    <div class="redirectToLogin">
      <span class="redirect" routerLink="/sign-in">Volver al login</span>
    </div>
  </div>
</div>
